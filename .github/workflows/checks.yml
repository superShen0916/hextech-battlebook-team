name: Team checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  full-check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install locked dependencies
        shell: pwsh
        run: python scripts/team.py setup
      - name: Download complete team data
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # Forks use the same published dataset; they do not have their own Releases.
        run: python scripts/team.py download
      - name: Run the maintained full workflow
        shell: pwsh
        run: |
          $teamTestTemp = Join-Path $env:GITHUB_WORKSPACE 'outputs/test-temp'
          New-Item -ItemType Directory -Force -Path $teamTestTemp | Out-Null
          $env:TEMP = $teamTestTemp
          $env:TMP = $teamTestTemp
          python scripts/workflow.py prepare --files haido/rating_lp.py --scope pipeline
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            outputs/workflow/**/*.log
            outputs/workflow/**/result.json
          retention-days: 7
