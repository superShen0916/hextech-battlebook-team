name: 缺陷报告
description: 报告可复现的功能或数据问题
title: '[Bug] '
body:
  - type: textarea
    id: behavior
    attributes:
      label: 问题与预期行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供页面、筛选条件及必要截图，不粘贴登录令牌、设备编号或访问记录。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本与环境
      description: 代码提交、数据Release、浏览器和操作系统。
