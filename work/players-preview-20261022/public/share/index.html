<style>
:root{color-scheme:dark;--bg:#0b1421;--text:#f0eee6;--muted:#9caabd;--gold:#e5c37c;--line:#344356}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#24334c,transparent 65%),var(--bg);font:14px/1.65 "Microsoft YaHei","Segoe UI",sans-serif;color:var(--text)}main{max-width:1080px;margin:auto;padding:28px 24px 48px}.header{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:20px;font-weight:700;letter-spacing:2px}.back{color:var(--muted);text-decoration:none;font-size:12px}h1{font-size:25px;margin:24px 0 5px}.intro{color:var(--muted);margin:0 0 20px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end;padding:18px;background:#152337;border:1px solid var(--line);border-radius:12px}.controls label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:12px}select,button,.download{font:inherit;padding:10px 15px;border:1px solid var(--line);border-radius:7px;color:var(--text);background:#0e1b2b}button{cursor:pointer;font-weight:700;color:#162236;background:var(--gold);border-color:var(--gold)}button:disabled{cursor:wait;opacity:.55}.download{margin-left:auto;display:inline-flex;align-items:center;text-decoration:none;background:#23374c;color:var(--gold)}.download[aria-disabled="true"]{opacity:.45;pointer-events:none}select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}#status{min-height:28px;color:var(--muted);font-size:12px;margin:12px 0;text-align:center}#status.error{color:#f0a3b2}.preview{display:flex;justify-content:center;min-height:180px}.preview img{display:block;width:100%;max-width:540px;height:auto;border-radius:5px;box-shadow:0 16px 70px #0008}.preview img:not([src]){display:none}.hint{text-align:center;color:var(--muted);font-size:12px;margin:16px 0}.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.empty strong{color:var(--text);display:block;font-size:1 <body><main>
<header class="header"><div class="brand">海克斯战报</div><a class="back" href="/">返回玩家大厅 →</a></header>
<h1>个人战报</h1><p class="intro">把真实同队战绩，做成一张可以分享的开黑战报。</p>
<div class="controls"><label>分享内容<select id="share-mode"><option value="shared">朋友荣誉战报 · 荣誉 + 搭档榜</option><option value="personal">个人名片 · 表现 + 英雄</option></select></label><label>统计范围<select id="days"><option value="0">全部已上传对局</option></select></label><label>荣誉门槛<select id="minimum"><option value="20">至少 20 场有效同队局</option><option value="30">至少 30 场有效同队局</option></select></label><button id="generate">生成分享图</button><a id="download" class="download" download="海克斯搭档战报.png" aria-disabled="true">下载分享图 PNG</a></div>
<div id="status" role="status">正在读取开黑战报…</div>
<div id="empty" class="empty" hidden><strong>还没有可生成的战报</strong>当前范围没有已保存的标准海克斯对局，调整统计范围后重试。</div>
<div class="preview"><img id="sharePreview" alt="当前账号的海克斯战报分享图"></div>
<p class="hint" id="hint" hidden>原图为 1080 × 2680 像素。手机可长按图片保存，也可点击上方下载。</p>
<canvas id="poster" width="1080" height="2680" hidden aria-hidden="true"></canvas>
</main>
<script type="module">

let snapshotPromise,visualPromise;
async function api(path){

 if(path==='/api/bootstrap')return {static:snapshot.static};

 document.title=subject.name+' · 海克斯'+(shared?'共同':'个人')+'战报';

 const archive=snapshot.players?.find(p=>p.name===subject.name),backId=legacy?(archive?.id||'shared-'+subject.id):subject.id;

function roundRect(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.3;ctx.stroke()}}
function text(ctx,value,x,y,size=24,color=colors.white,weight=400,align='left'){ctx.font=weight+' '+size+'px '+font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(String(value),x,y)}
function fit(ctx,value,maxWidth,size=24,weight=400){ctx.font=weight+' '+size+'px '+font;let result=String(value);if(ctx.measureText(result).width<=maxWidth)return result;while(result.length&&ctx.measureText(result+'…').width>maxWidth)result=result.slice(0,-1);return result+'…'}

function hex(ctx,x,y,r,stroke,fill){ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}
function line(ctx,x,y,w,color=colors.line){ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.stroke()}
async function loadIcons(report){const people=[...(report.personal?.champions||[]),...(report.leaderboard||[]),...(report.awards||[]).flatMap(a=>a.leaders||[])],ids=[...new Set(people.map(p=>p.champion_id).filter(id=>id!==null&&id!==undefined))],icons=new Map();await Promise.all(ids.map(id=>new Promise(resolve=>{const data=boot.static?.champions?.[String(id)],url=data?.icon_url;if(typeof url!=='string'||!url.startsWith('/assets/'))return resolve();const img=new Image();let ended=false;const finish=ok=>{if(ended)return;ended=true;clearTimeout(timer);if(ok)icons.set(String(id),img);resolve()};const timer=setTimeout(()=>finish(false),4500);img.onload=()=>finish(true);img.onerror=()=>finish(false);img.src=url})));await Promise.all([['profile-avatar',report.visual?.avatar_url],['profile-cover',report.visual?.splash_url]].map(([key,url])=>new Promise(resolve=>{if(typeof url!=='string'||!url.startsWith('/assets/'))return resolve();const img=new Image();const timer=setTimeout(resolve,4500);img.onload=()=>{clearTimeout(timer);icons.set(key,img);resolve()};img.onerror=()=>{clearTimeout(timer);resolve()};img.src=url})));return icons}
function portrait(ctx,icons,p,x,y,size=55){roundRect(ctx,x,y,size,size,10,'#293d50','#59718a');const img=icons.get(String(p?.champion_id));if(img){ctx.save();roundRect(ctx,x+2,y+2,size-4,size-4,8);ctx.clip();ctx.drawImage(img,x+2,y+2,size-4,size-4);ctx.restore()}else{text(ctx,(boot.static?.champions?.[String(p?.champion_id)]?.name||p?.champion_name||leaderName(p)).slice(0,2),x+size/2,y+size/2+7,Math.min(23,size*.37),colors.gold,600,'center')}}
function awardValue(id,p){if(!p)return'暂无记录';if(id==='best_partner'||id==='worst_partner')return percent(p.win_rate);if(['damage_carry','teamfighter','mvp_star'].includes(id))return percent(p.value);if(id==='assist_master'||id==='kill_harvester')return fmt(p.value,1)+' /局';if(id==='most_played')return fmt(p.value??p.games)+' 场';if(id==='penta_king')return fmt(p.value)+' 次';return fmt(p.value,0)+' /分'}

function drawStyleBlock(ctx,report,y){
 const style=report.style;if(!style)return;

 badges.forEach((p,i)=>{const x=88+i*300;roundRect(ctx,x,y+220,284,48,7,'#c4ae6f14','#907d4c55');text(ctx,fit(ctx,p.definition.name+' '+['','I','II','III'][p.tier],260,20,500),x+14,y+251,20,colors.gold,500)});

 text(ctx,fit(ctx,report.account.name,740,60,700),64,174,60,colors.white,700);

 text(ctx,'已收录 '+fmt(c.saved)+' 场 · '+fmt(c.eligible)+' 场有效 · '+(number(c.missing)?fmt(c.missing)+' 场已发现待补':'部分同队样本'),64,272,23,colors.muted);
 const metrics=[['胜率',percent(s.win_rate)],['KDA',fmt(s.kda,2)],['每分钟伤害',fmt(s.dpm)],['MVP',fmt(a.mvp)+' 次'],['败方 ACE',fmt(a.ace)+' 次'],['五杀',fmt(s.penta_kills)+' 次']];
 metrics.forEach(([label,value],i)=>{const x=64+(i%3)*326,y=322+Math.floor(i/3)*157;roundRect(ctx,x,y,300,132,12,colors.panel);text(ctx,label,x+22,y+37,22,colors.muted);text(ctx,value,x+22,y+98,42,colors.white,600)});

 (p.champions||[]).slice(0,3).forEach((h,i)=>{const y=1107+i*96;portrait(ctx,icons,h,64,y,64);text(ctx,boot.static?.champions?.[String(h.champion_id)]?.name||h.champion_name,151,y+27,27,colors.white,500);text(ctx,fmt(h.games)+' 场 · 胜率 '+percent(h.win_rate)+' · KDA '+fmt(h.kda,2),151,y+63,21,colors.muted)});

function renderPoster(report,icons){if(!report.shared_mode)return renderPersonal(report,icons);const canvas=$('poster'),ctx=canvas.getContext('2d');canvas.width=W;canvas.height=H;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';const gradient=ctx.createLinearGradient(0,0,W,H);gradient.addColorStop(0,'#10263a');gradient.addColorStop(.48,colors.bg);gradient.addColorStop(1,'#15283d');ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);for(let row=0;row<Math.ceil(H/190)+1;row++)for(let col=0;col<7;col++)if((row*3+col)%4===0)hex(ctx,60+col*170+(row%2)*80,row*190,92,'#213c5044');ctx.fillStyle=colors.gold;ctx.fillRect(64,61,42,5);text(ctx,'海克斯战报  /  开黑档案',124,73,20,colors.gold,500);text(ctx,'STANDARD ARAM MAYHEM',1016,73,15,colors.muted,400,'right');const gameAvatar=icons.get('profile-avatar');if(gameAvatar){ctx.save();ctx.beginPath();ctx.arc(953,159,53,0,2*Math.PI);ctx.clip();ctx.drawImage(gameAvatar,900,106,106,106);ctx.restore();ctx.strokeStyle=colors.gold;ctx.beginPath();ctx.arc(953,159,57,0,2*Math.PI);ctx.stroke()}text(ctx,report.subject_scope?'同队样本荣誉战报':'朋友荣誉战报',64,159,58,colors.white,700);const owner=report.account?.game_name||report.account?.name;const ownerLine=owner?owner+' 的开黑战报':'已保存对局 · 我的开黑战报';text(ctx,fit(ctx,ownerLine,800,30,500),64,214,30,colors.gold,500);const range=report.overview?.time_range||{},start=day(range.oldest_ms),end=day(range.newest_ms),rangeText=start&&end?start+' — '+end:'当前已保存对局';text(ctx,rangeText,64,251,19,colors.muted);text(ctx,'生成于 '+today(),1016,251,18,colors.muted,400,'right');
 const overview=report.overview||{},minimum=report.minimum_award_games??20;roundRect(ctx,64,280,952,116,14,'#1d3144','#52604f');const stats=[['总有效局',fmt(overview.eligible)+' 场'],['玩家胜率',percent(overview.win_rate)],['常玩队友',fmt(overview.companions)+' 位'],['荣誉门槛','≥'+fmt(minimum)+' 场']];for(let i=0;i<4;i++){const x=88+i*238;text(ctx,stats[i][0],x,316,19,colors.muted);text(ctx,stats[i][1],x,365,35,i===1?colors.gold:colors.white,650);if(i===1)text(ctx,fmt(overview.wins)+' 胜 / '+fmt(overview.result_samples)+' 场结果样本',x,386,13,colors.muted);if(i<3){ctx.fillStyle='#4d6072';ctx.fillRect(x+213,305,1,62)}}
 drawStyleBlock(ctx,report,430);text(ctx,'这局，有你真好',64,810,29,colors.white,650);text(ctx,'十项同队荣誉',1016,810,18,colors.muted,400,'right');const awards=new Map((report.awards||[]).map(a=>[a.id,a]));awardTypes.forEach(([id,title,label],index)=>awardCard(ctx,awards.get(id),id,title,label,index,icons,minimum));
 text(ctx,'常玩拍档榜',64,BOARD_Y,30,colors.white,650);text(ctx,'TOP 06  /  一起赢，也一起成长',1016,BOARD_Y,17,colors.muted,400,'right');text(ctx,'队友 / 代表英雄',80,BOARD_Y+45,18,colors.muted);text(ctx,'有效同队',551,BOARD_Y+45,17,colors.muted,400,'right');text(ctx,'同队胜率',690,BOARD_Y+45,17,colors.muted,400,'right');text(ctx,'KDA',826,BOARD_Y+45,17,colors.muted,400,'right');text(ctx,'伤害占比',992,BOARD_Y+45,17,colors.muted,400,'right');line(ctx,64,BOARD_Y+64,952);const rows=(report.leaderboard||[]).slice(0,6);if(!rows.length){roundRect(ctx,64,BOARD_Y+88,952,410,12,'#142638',colors.line);text(ctx,'暂时没有符合条件的拍档记录',540,BOARD_Y+283,29,colors.white,500,'center');text(ctx,'个人战绩已保留，荣誉等待更多同队样本',540,BOARD_Y+328,21,colors.muted,400,'center')}else rows.forEach((p,i)=>{const y=BOARD_Y+83+i*91;if(i%2===0)roundRect(ctx,64,y-3,952,85,9,'#1b2e4077');const rank=p.rank??i+1;text(ctx,String(rank).padStart(2,'0'),81,y+43,23,number(rank)&&rank<=3?colors.gold:colors.muted,600);portrait(ctx,icons,p,130,y+10,55);const name=fit(ctx,leaderName(p),279,25,600);text(ctx,name,201,y+35,25,colors.white,600);const champion=boot.static?.champions?.[String(p.champion_id)]?.name||p.champion_name;let secondary=p.qualified===false?'未达荣誉门槛':champion||'代表英雄未记录';const evaluated=p.secondary||{};if(number(evaluated.award_samples)&&evaluated.award_samples>0&&number(evaluated.mvp)&&number(evaluated.ace))secondary+=' · MVP '+fmt(evaluated.mvp)+' / ACE '+fmt(evaluated.ace);text(ctx,fit(ctx,secondary,279,16),201,y+62,16,colors.muted);text(ctx,fmt(p.games)+' 场',551,y+43,23,colors.white,500,'right');text(ctx,percent(p.win_rate),690,y+43,23,colors.mint,500,'right');text(ctx,fmt(p.secondary?.kda,2),826,y+43,23,colors.white,500,'right');text(ctx,percent(p.secondary?.damage_share),992,y+43,23,colors.white,500,'right')});

async function generate(){const run=++generation,button=$('generate'),download=$('download');button.disabled=true;$('sharePreview').hidden=true;$('hint').hidden=true;download.setAttribute('aria-disabled','true');$('status').className='';$('status').textContent='正在汇总真实战绩并绘制分享图…';$('empty').hidden=true;try{const params=new URLSearchParams({minimum:$('minimum').value,days:$('days').value}),report=await api('/api/share-report?'+params);if(run!==generation)return;const saved=report.overview?.saved??report.overview?.eligible;if(!number(saved)||saved<=0){$('empty').hidden=false;$('sharePreview').removeAttribute('src');$('hint').hidden=true;$('status').textContent='当前范围暂无已保存战绩。';return}const icons=await loadIcons(report);if(run!==generation)return;const png=renderPoster(report,icons);$('sharePreview').src=png;$('sharePreview').hidden=false;download.href=png;download.download=report.account.name+'的海克斯'+(report.shared_mode?'同队':'个人')+'战报.png';download.setAttribute('aria-disabled','false');$('hint').hidden=false;$('status').textContent='分享图已生成 · '+W+' × '+$('poster').height+' PNG';$('hint').textContent='原图为 '+W+' × '+$('poster').height+' 像素。手机可长按图片保存，也可点击上方下载。'}catch(error){if(run===generation){$('status').className='error';$('status').textContent='暂时无法生成分享图，请稍后刷新页面重试。'}}finally{if(run===generation)button.disabled=false}}
$('share-mode').onchange=()=>{const url=new URL(location.href);url.searchParams.set('scope',$('share-mode').value);history.replaceState(null,'',url);generate()};
$('generate').onclick=generate;
$('minimum').onchange=generate;
$('days').onchange=generate;
(async()=>{try{boot=await api('/api/bootstrap');await generate()}catch(error){$('status').className='error';$('status').textContent='暂时无法读取战报，请稍后重试。'}})();
