<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>海克斯战报馆 · 尺寸预览</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0c151c}iframe{display:block;border:0}</style></head><body><iframe title="页面尺寸预览"></iframe><script>const params=new URLSearchParams(location.search),width=[320,390,1280].includes(Number(params.get('width')))?Number(params.get('width')):1280,height=Number(params.get('height'))||1100;document.body.style.width=width+'px';const frame=document.querySelector('iframe');frame.width=String(width);frame.height=String(Math.min(4000,Math.max(600,height)));const q=new URLSearchParams();for(const key of ['player','a','an','b','bn','subject','name','scope','achievementPlayer','achievementName'])if(params.get(key))q.set(key,params.get(key));frame.src=(params.get('page')==='share'?'/share/index.html':'/')+(q.size?'?'+q:'')+(params.get('anchor')?'#'+params.get('anchor'):'');</script></body></html>
